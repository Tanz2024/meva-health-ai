name: Bug report
description: Report something that doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Do not include real patient data in this report, under any circumstances.**
        MEVA only ever uses synthetic (Synthea-generated) data — if your bug report
        needs example data, use synthetic patient IDs already in this repo.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands/code, if possible.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: OS
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This report does not contain any real patient data
          required: true
        - label: I searched existing issues and this isn't a duplicate
          required: true
