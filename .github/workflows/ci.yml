name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run offline test suite (excludes slow/deployment-install tests)
        run: pytest -q -m "not slow"

      - name: Run release-readiness checks
        run: python3 scripts/release_check.py

  deployment-install:
    # The "slow" marker covers tests/test_deployment_install.py, which performs
    # a real `pip install -e .` in a disposable venv. Running that concurrently
    # across all 4 matrix Python versions above was a source of intermittent,
    # runner-load-dependent CI flakiness (see CHANGELOG.md / Stage 8E2 CI
    # audit) — not a version-specific code defect. It now runs once, alone,
    # on a single stable Python version instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run slow/deployment-install tests
        run: pytest -q -m slow
